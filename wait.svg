<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 314" width="780" height="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="wt wd">
<title id="wt">Waiting time before a GPU job can start</title>
<desc id="wd">Cluster · whole GPU: ≈ 9 h until scheduled (squeue --start, 16 Oct 2026); Cluster · GPU share: starts within seconds, but only small jobs fit; Workstation: no queue; idle model server wakes in 11.4 s; one training fold on the A5000 takes about 25 minutes</desc>
<rect width="780" height="314" rx="12" fill="#0f1a20" stroke="#22363f"/>
<text x="24" y="34" fill="#e8f1f3" font-size="15" font-weight="700">Waiting before a GPU job can start</text>
<text x="24" y="56" fill="#7d99a2" font-size="11.5">An agent needs dozens of build-train-check rounds a day; the queue is paid on every round</text>
<text x="24" y="72" fill="#7d99a2" font-size="11.5">Dashed: one training fold of Clara's U-Net on the A5000, ≈ 25 min, for scale</text>
<line x1="190.0" y1="90" x2="190.0" y2="258" stroke="#22363f"/>
<text x="190.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">0 h</text>
<line x1="300.0" y1="90" x2="300.0" y2="258" stroke="#22363f"/>
<text x="300.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">2 h</text>
<line x1="410.0" y1="90" x2="410.0" y2="258" stroke="#22363f"/>
<text x="410.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">4 h</text>
<line x1="520.0" y1="90" x2="520.0" y2="258" stroke="#22363f"/>
<text x="520.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">6 h</text>
<line x1="630.0" y1="90" x2="630.0" y2="258" stroke="#22363f"/>
<text x="630.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">8 h</text>
<line x1="740.0" y1="90" x2="740.0" y2="258" stroke="#22363f"/>
<text x="740.0" y="276" fill="#7d99a2" font-size="11" text-anchor="middle">10 h</text>
<line x1="212.9" y1="84" x2="212.9" y2="258" stroke="#e8f1f3" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
<g><title>Cluster · whole GPU: ≈ 9 h until scheduled (squeue --start, 16 Oct 2026)</title><text x="180" y="117" fill="#e8f1f3" font-size="12" text-anchor="end">Cluster · whole GPU</text><rect x="190.0" y="104" width="495.0" height="18" rx="3" fill="#c97a2a"/><text x="222.9" y="140" fill="#7d99a2" font-size="11">≈ 9 h until scheduled (squeue --start, 16 Oct 2026)</text></g>
<g><title>Cluster · GPU share: starts within seconds, but only small jobs fit</title><text x="180" y="171" fill="#e8f1f3" font-size="12" text-anchor="end">Cluster · GPU share</text><rect x="190.0" y="158" width="3.0" height="18" rx="3" fill="#25a294"/><text x="222.9" y="171" fill="#7d99a2" font-size="11">starts within seconds, but only small jobs fit</text></g>
<g><title>Workstation: no queue; idle model server wakes in 11.4 s</title><text x="180" y="225" fill="#e8f1f3" font-size="12" text-anchor="end">Workstation</text><rect x="190.0" y="212" width="3.0" height="18" rx="3" fill="#25a294"/><text x="222.9" y="225" fill="#7d99a2" font-size="11">no queue; idle model server wakes in 11.4 s</text></g>
<text x="218.9" y="94" fill="#e8f1f3" font-size="11">25 min</text>
</svg>