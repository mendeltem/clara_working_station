<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#1b2430">One model request: who answers it?</text>
  <text x="40" y="70" font-size="14" fill="#5b6672">Every request from clara-agent goes to the Weiche relay (127.0.0.1:8770). Fixed rules come first; System One only chooses among Clé models.</text>

  <rect x="500" y="100" width="280" height="56" rx="10" fill="#fff8e8" stroke="#c98a00"/>
  <text x="640" y="125" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">Request from clara-agent</text>
  <text x="640" y="144" font-size="12" text-anchor="middle" fill="#5b6672">system prompt, conversation, tool results</text>

  <!-- step 1 -->
  <rect x="420" y="190" width="440" height="120" rx="12" fill="#fff" stroke="#1b2430" stroke-width="1.6"/>
  <text x="640" y="216" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">1. Fixed rules (no model involved)</text>
  <text x="640" y="240" font-size="12.5" text-anchor="middle" fill="#3a4450">subject or session ids, cohort names, image files: anywhere</text>
  <text x="640" y="258" font-size="12.5" text-anchor="middle" fill="#3a4450">data paths: anywhere except inside the topic brief</text>
  <text x="640" y="276" font-size="12.5" text-anchor="middle" fill="#3a4450">privacy markers: only in user or tool text</text>
  <text x="640" y="296" font-size="12.5" text-anchor="middle" fill="#3a4450">model "lokal" requested</text>

  <rect x="60" y="200" width="300" height="140" rx="12" fill="#eaf6f0" stroke="#1d8a5a" stroke-width="2"/>
  <text x="210" y="228" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">Local Qwen3.8-27B</text>
  <text x="210" y="252" font-size="12.5" text-anchor="middle" fill="#3a4450">register the need (lokal-bedarf),</text>
  <text x="210" y="270" font-size="12.5" text-anchor="middle" fill="#3a4450">start the model if the card has room,</text>
  <text x="210" y="288" font-size="12.5" text-anchor="middle" fill="#3a4450">System One moves to the CPU;</text>
  <text x="210" y="306" font-size="12.5" text-anchor="middle" fill="#3a4450">need ends 10 min after the last</text>
  <text x="210" y="324" font-size="12.5" text-anchor="middle" fill="#3a4450">local request, then the GPU is free</text>
  <line x1="420" y1="250" x2="362" y2="250" stroke="#1d8a5a" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="391" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d8a5a">hit</text>

  <!-- step 2 -->
  <line x1="640" y1="310" x2="640" y2="348" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="650" y="334" font-size="12" fill="#5b6672">no hit</text>
  <rect x="420" y="350" width="440" height="100" rx="12" fill="#f3eefb" stroke="#6b3fb8" stroke-width="1.6"/>
  <text x="640" y="376" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">2. System One: kind of work (new user turn)</text>
  <text x="640" y="400" font-size="12.5" text-anchor="middle" fill="#3a4450">H2O-Lightning-4B, one choice question, 0.2-0.3 s on the GPU</text>
  <text x="640" y="418" font-size="12.5" text-anchor="middle" fill="#3a4450">counts only at p &gt;= 0.8, otherwise the default model clea</text>
  <text x="640" y="436" font-size="12.5" text-anchor="middle" fill="#3a4450">same turn (tool loop) keeps its model</text>

  <!-- mapping -->
  <rect x="920" y="330" width="320" height="200" rx="12" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="1080" y="356" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Clé model per kind (measured)</text>
  <text x="945" y="384" font-size="12.5" fill="#3a4450">trivial, coding, research</text><text x="1215" y="384" font-size="12.5" text-anchor="end" font-weight="bold" fill="#1f6fd1">clea</text>
  <text x="945" y="408" font-size="12.5" fill="#3a4450">hard (statistics, planning)</text><text x="1215" y="408" font-size="12.5" text-anchor="end" font-weight="bold" fill="#1f6fd1">frontier</text>
  <text x="945" y="432" font-size="12.5" fill="#3a4450">writing</text><text x="1215" y="432" font-size="12.5" text-anchor="end" font-weight="bold" fill="#1f6fd1">fast</text>
  <text x="945" y="456" font-size="12.5" fill="#3a4450">image in the request</text><text x="1215" y="456" font-size="12.5" text-anchor="end" font-weight="bold" fill="#1f6fd1">vision</text>
  <text x="945" y="480" font-size="12.5" fill="#3a4450">unsure (p &lt; 0.8)</text><text x="1215" y="480" font-size="12.5" text-anchor="end" font-weight="bold" fill="#1f6fd1">clea</text>
  <text x="945" y="510" font-size="11.5" fill="#5b6672">29 Oct: 32 tasks x 2; eu dropped</text>
  <line x1="860" y1="400" x2="918" y2="400" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- step 3 -->
  <line x1="640" y1="450" x2="640" y2="488" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="420" y="490" width="440" height="80" rx="12" fill="#eef4fb" stroke="#1f6fd1" stroke-width="2"/>
  <text x="640" y="516" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">3. Clé answers (Charité model hub)</text>
  <text x="640" y="540" font-size="12.5" text-anchor="middle" fill="#3a4450">the key stays in the relay; max_tokens &gt;= 8000;</text>
  <text x="640" y="558" font-size="12.5" text-anchor="middle" fill="#3a4450">streamed back to clara-agent unchanged</text>

  <!-- step 4 -->
  <line x1="640" y1="570" x2="640" y2="608" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="420" y="610" width="440" height="90" rx="12" fill="#f3eefb" stroke="#6b3fb8" stroke-width="1.6"/>
  <text x="640" y="636" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">4. System One judges the finished answer</text>
  <text x="640" y="660" font-size="12.5" text-anchor="middle" fill="#3a4450">"does the result answer the request?" in the background</text>
  <text x="640" y="678" font-size="12.5" text-anchor="middle" fill="#3a4450">logged per kind and model (relay.jsonl)</text>

  <rect x="920" y="610" width="320" height="90" rx="12" fill="#fff" stroke="#6b3fb8" stroke-dasharray="6 3"/>
  <text x="1080" y="638" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Verdict "no"</text>
  <text x="1080" y="662" font-size="12.5" text-anchor="middle" fill="#3a4450">the next turn of this conversation</text>
  <text x="1080" y="680" font-size="12.5" text-anchor="middle" fill="#3a4450">goes to frontier, then back to normal</text>
  <line x1="860" y1="655" x2="918" y2="655" stroke="#6b3fb8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- approval side box -->
  <rect x="60" y="430" width="300" height="270" rx="12" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="210" y="458" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">Commands and writes</text>
  <text x="210" y="484" font-size="12.5" text-anchor="middle" fill="#3a4450">separate path in clara-agent:</text>
  <text x="80" y="512" font-size="12.5" fill="#3a4450">1. deny rules (always win)</text>
  <text x="80" y="534" font-size="12.5" fill="#3a4450">2. read tools run</text>
  <text x="80" y="556" font-size="12.5" fill="#3a4450">3. allow rules, permission mode</text>
  <text x="80" y="578" font-size="12.5" fill="#3a4450">4. System One gate (:8765):</text>
  <text x="96" y="598" font-size="12.5" fill="#3a4450">fixed rules, then p(auto) &gt;= 0.8</text>
  <text x="96" y="618" font-size="12.5" fill="#3a4450">-> run, otherwise ask the human</text>
  <text x="80" y="642" font-size="12.5" fill="#3a4450">5. the human (terminal or phone)</text>
  <text x="80" y="672" font-size="11.5" fill="#5b6672">the kernel sandbox holds either way</text>
</svg>
