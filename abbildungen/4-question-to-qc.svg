<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker>
  </defs>
  <rect width="1280" height="680" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#1b2430">From a question to a QC page</text>
  <text x="40" y="70" font-size="14" fill="#5b6672">Example: "I want a WMH segmentation model, can you research it?" Everything after the prompt runs on the workstation.</text>

  <!-- row 1 -->
  <rect x="40" y="110" width="260" height="100" rx="12" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="170" y="138" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">1. Prompt</text>
  <text x="170" y="162" font-size="12.5" text-anchor="middle" fill="#3a4450">phone (Telegram) or terminal;</text>
  <text x="170" y="180" font-size="12.5" text-anchor="middle" fill="#3a4450">the goal in plain language</text>

  <rect x="340" y="110" width="260" height="100" rx="12" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="470" y="138" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">2. Research</text>
  <text x="470" y="162" font-size="12.5" text-anchor="middle" fill="#3a4450">Clé splits the question; research</text>
  <text x="470" y="180" font-size="12.5" text-anchor="middle" fill="#3a4450">workers search papers through the</text>
  <text x="470" y="198" font-size="12.5" text-anchor="middle" fill="#3a4450">exit guard (no data leaves)</text>

  <rect x="640" y="110" width="260" height="100" rx="12" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="770" y="138" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">3. Method shortlist</text>
  <text x="770" y="162" font-size="12.5" text-anchor="middle" fill="#3a4450">2D U-Net, 3D U-Net, nnU-Net, ...;</text>
  <text x="770" y="180" font-size="12.5" text-anchor="middle" fill="#3a4450">each becomes a job with a</text>
  <text x="770" y="198" font-size="12.5" text-anchor="middle" fill="#3a4450">countable acceptance list</text>

  <rect x="940" y="110" width="300" height="100" rx="12" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="1090" y="138" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">4. Job queue (outer loop)</text>
  <text x="1090" y="162" font-size="12.5" text-anchor="middle" fill="#3a4450">one method at a time;</text>
  <text x="1090" y="180" font-size="12.5" text-anchor="middle" fill="#3a4450">the next one starts when this</text>
  <text x="1090" y="198" font-size="12.5" text-anchor="middle" fill="#3a4450">one is accepted or given up</text>

  <line x1="300" y1="160" x2="338" y2="160" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="600" y1="160" x2="638" y2="160" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="900" y1="160" x2="938" y2="160" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- inner loop frame -->
  <rect x="40" y="270" width="820" height="270" rx="16" fill="#fbfcfd" stroke="#1b2430" stroke-width="1.6"/>
  <text x="60" y="296" font-size="15" font-weight="bold" fill="#1b2430">5. Inner loop, per method (rounds of the antreiber)</text>
  <path d="M1090,210 V240 H450 V268" fill="none" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="70" y="320" width="240" height="120" rx="12" fill="#fff8e8" stroke="#c98a00" stroke-dasharray="7 4"/>
  <text x="190" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Clara writes the code</text>
  <text x="190" y="370" font-size="12.5" text-anchor="middle" fill="#3a4450">data loader, model, training,</text>
  <text x="190" y="388" font-size="12.5" text-anchor="middle" fill="#3a4450">prediction, evaluation;</text>
  <text x="190" y="406" font-size="12.5" text-anchor="middle" fill="#3a4450">smoke test first</text>
  <text x="190" y="426" font-size="11.5" text-anchor="middle" fill="#9a6a00">in the sandbox</text>

  <rect x="340" y="320" width="240" height="120" rx="12" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="460" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">GPU queue trains</text>
  <text x="460" y="370" font-size="12.5" text-anchor="middle" fill="#3a4450">grossauftrag runs one heavy</text>
  <text x="460" y="388" font-size="12.5" text-anchor="middle" fill="#3a4450">job at a time on open</text>
  <text x="460" y="406" font-size="12.5" text-anchor="middle" fill="#3a4450">training data</text>

  <rect x="610" y="320" width="230" height="120" rx="12" fill="#eaf6f0" stroke="#1d8a5a" stroke-width="1.8"/>
  <text x="725" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Acceptance check</text>
  <text x="725" y="370" font-size="12.5" text-anchor="middle" fill="#3a4450">counts facts in the files</text>
  <text x="725" y="388" font-size="12.5" text-anchor="middle" fill="#3a4450">(asks no model); then the</text>
  <text x="725" y="406" font-size="12.5" text-anchor="middle" fill="#3a4450">critic reads the result</text>

  <line x1="310" y1="380" x2="338" y2="380" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="580" y1="380" x2="608" y2="380" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M725,440 V500 H190 V442" fill="none" stroke="#4a5560" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="458" y="492" font-size="12" text-anchor="middle" fill="#5b6672">criteria still open: next round, with the open points in the message</text>

  <!-- right column -->
  <rect x="900" y="290" width="340" height="100" rx="12" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="1070" y="318" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">6. Evaluation</text>
  <text x="1070" y="342" font-size="12.5" text-anchor="middle" fill="#3a4450">test set never used for training;</text>
  <text x="1070" y="360" font-size="12.5" text-anchor="middle" fill="#3a4450">official metric (Dice, lesion F1)</text>
  <text x="1070" y="378" font-size="12.5" text-anchor="middle" fill="#3a4450">next to the public leaderboard</text>
  <path d="M840,350 H870 V340 H898" fill="none" stroke="#1d8a5a" stroke-width="2" marker-end="url(#a)"/>
  <text x="870" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d8a5a">met</text>

  <rect x="900" y="440" width="340" height="100" rx="12" fill="#eaf6f0" stroke="#1d8a5a" stroke-width="1.8"/>
  <text x="1070" y="468" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">7. Result</text>
  <text x="1070" y="492" font-size="12.5" text-anchor="middle" fill="#3a4450">best model, comparison table and</text>
  <text x="1070" y="510" font-size="12.5" text-anchor="middle" fill="#3a4450">an HTML QC page; a short message</text>
  <text x="1070" y="528" font-size="12.5" text-anchor="middle" fill="#3a4450">to the phone with the link</text>
  <line x1="1070" y1="390" x2="1070" y2="438" stroke="#4a5560" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="40" y="580" width="1200" height="64" rx="10" fill="#fff" stroke="#d5dbe1"/>
  <text x="60" y="606" font-size="13" fill="#1b2430"><tspan font-weight="bold">Who sees what.</tspan> Clara sees the data and has no network. Clé and the research workers see questions and code, never data;</text>
  <text x="60" y="628" font-size="13" fill="#1b2430">a model request that touches patient data goes to the local GPU model instead (see "One model request").</text>
</svg>
