<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a5a"/></marker>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#1b2430">Clara on Alita: how the system works (29 Oct 2026)</text>
  <text x="40" y="70" font-size="14" fill="#5b6672">One agent harness (clara-agent). Clé by default, the local GPU model only for patient data. Nothing leaves the machine except through the three gates on the right.</text>

  <!-- outside left -->
  <rect x="30" y="110" width="190" height="230" rx="14" fill="#f3f5f7" stroke="#b9c2cc"/>
  <text x="125" y="135" font-size="14" font-weight="bold" fill="#4a5560" text-anchor="middle">YOU</text>
  <rect x="50" y="150" width="150" height="70" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="125" y="180" font-size="15" text-anchor="middle" fill="#1b2430">Phone</text>
  <text x="125" y="200" font-size="12" text-anchor="middle" fill="#5b6672">Telegram, ClaraBot</text>
  <rect x="50" y="240" width="150" height="80" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="125" y="270" font-size="15" text-anchor="middle" fill="#1b2430">Terminal</text>
  <text x="125" y="290" font-size="12" text-anchor="middle" fill="#5b6672">agent / clara,</text>
  <text x="125" y="306" font-size="12" text-anchor="middle" fill="#5b6672">Claude Code</text>

  <!-- workstation -->
  <rect x="250" y="100" width="770" height="670" rx="18" fill="#fbfcfd" stroke="#1b2430" stroke-width="2"/>
  <text x="270" y="128" font-size="16" font-weight="bold" fill="#1b2430">Workstation Alita (RTX A5000 24 GB)</text>

  <!-- entry -->
  <rect x="280" y="150" width="200" height="66" rx="10" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="380" y="177" font-size="14" text-anchor="middle" fill="#1b2430">Telegram bridge</text>
  <text x="380" y="197" font-size="12" text-anchor="middle" fill="#5b6672">clara-telegram</text>
  <rect x="280" y="240" width="200" height="66" rx="10" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="380" y="267" font-size="14" text-anchor="middle" fill="#1b2430">clara serve :8766</text>
  <text x="380" y="287" font-size="12" text-anchor="middle" fill="#5b6672">sessions, approvals</text>
  <rect x="280" y="330" width="200" height="86" rx="10" fill="#eef4fb" stroke="#1f6fd1"/>
  <text x="380" y="357" font-size="14" text-anchor="middle" fill="#1b2430">Job queue</text>
  <text x="380" y="377" font-size="12" text-anchor="middle" fill="#5b6672">dauerlauf -> antreiber</text>
  <text x="380" y="395" font-size="12" text-anchor="middle" fill="#5b6672">rounds, acceptance, critic</text>

  <!-- agent sandbox -->
  <rect x="520" y="150" width="230" height="266" rx="14" fill="#fff8e8" stroke="#c98a00" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="635" y="177" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2430">clara-agent</text>
  <text x="635" y="198" font-size="12" text-anchor="middle" fill="#5b6672">read, write, edit, search,</text>
  <text x="635" y="214" font-size="12" text-anchor="middle" fill="#5b6672">bash, ask, todo, memory</text>
  <text x="635" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a6a00">Sandbox (kernel, no root)</text>
  <text x="635" y="270" font-size="12" text-anchor="middle" fill="#5b6672">Landlock: writes only in the</text>
  <text x="635" y="286" font-size="12" text-anchor="middle" fill="#5b6672">project and listed folders</text>
  <text x="635" y="306" font-size="12" text-anchor="middle" fill="#5b6672">TCP only to 8770, 8765, 8899</text>
  <text x="635" y="326" font-size="12" text-anchor="middle" fill="#5b6672">seccomp: no UDP, no ICMP,</text>
  <text x="635" y="342" font-size="12" text-anchor="middle" fill="#5b6672">no raw sockets, no io_uring</text>
  <text x="635" y="372" font-size="12" text-anchor="middle" fill="#5b6672">tools inside: training on the</text>
  <text x="635" y="388" font-size="12" text-anchor="middle" fill="#5b6672">GPU, bild (local images)</text>

  <!-- relay / system one -->
  <rect x="790" y="150" width="210" height="86" rx="10" fill="#f3eefb" stroke="#6b3fb8"/>
  <text x="895" y="177" font-size="14" text-anchor="middle" fill="#1b2430">Weiche relay :8770</text>
  <text x="895" y="197" font-size="12" text-anchor="middle" fill="#5b6672">one model endpoint;</text>
  <text x="895" y="213" font-size="12" text-anchor="middle" fill="#5b6672">holds the Clé key</text>
  <rect x="790" y="256" width="210" height="96" rx="10" fill="#f3eefb" stroke="#6b3fb8"/>
  <text x="895" y="282" font-size="14" text-anchor="middle" fill="#1b2430">System One :8761</text>
  <text x="895" y="300" font-size="12" text-anchor="middle" fill="#5b6672">H2O-Lightning-4B</text>
  <text x="895" y="318" font-size="12" text-anchor="middle" fill="#5b6672">model per turn, verdict,</text>
  <text x="895" y="334" font-size="12" text-anchor="middle" fill="#5b6672">approval gate :8765</text>

  <!-- local -->
  <rect x="520" y="460" width="230" height="96" rx="10" fill="#eaf6f0" stroke="#1d8a5a" stroke-width="2"/>
  <text x="635" y="488" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Local Qwen3.8-27B :8000</text>
  <text x="635" y="508" font-size="12" text-anchor="middle" fill="#5b6672">started only for patient data,</text>
  <text x="635" y="524" font-size="12" text-anchor="middle" fill="#5b6672">released after 10 min idle</text>
  <text x="635" y="542" font-size="12" text-anchor="middle" fill="#5b6672">(modellwache, lokal-bedarf)</text>
  <rect x="280" y="460" width="200" height="96" rx="10" fill="#eaf6f0" stroke="#1d8a5a" stroke-width="2"/>
  <text x="380" y="490" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Patient data</text>
  <text x="380" y="510" font-size="12" text-anchor="middle" fill="#5b6672">~/data, cohorts, images</text>
  <text x="380" y="528" font-size="12" text-anchor="middle" fill="#5b6672">never leave the machine</text>
  <rect x="280" y="590" width="200" height="80" rx="10" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="380" y="620" font-size="14" text-anchor="middle" fill="#1b2430">GPU queue</text>
  <text x="380" y="640" font-size="12" text-anchor="middle" fill="#5b6672">grossauftrag: one heavy</text>
  <text x="380" y="656" font-size="12" text-anchor="middle" fill="#5b6672">training run at a time</text>
  <rect x="520" y="590" width="230" height="80" rx="10" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="635" y="620" font-size="14" text-anchor="middle" fill="#1b2430">Morning research 06:00</text>
  <text x="635" y="640" font-size="12" text-anchor="middle" fill="#5b6672">5 research workers,</text>
  <text x="635" y="656" font-size="12" text-anchor="middle" fill="#5b6672">report + Telegram summary</text>
  <rect x="790" y="460" width="210" height="96" rx="10" fill="#f3f5f7" stroke="#8a96a3"/>
  <text x="895" y="488" font-size="14" text-anchor="middle" fill="#1b2430">Exit guard :8899</text>
  <text x="895" y="508" font-size="12" text-anchor="middle" fill="#5b6672">frag-draussen: checks that</text>
  <text x="895" y="524" font-size="12" text-anchor="middle" fill="#5b6672">a question carries no data</text>

  <!-- outside right -->
  <rect x="1050" y="110" width="200" height="560" rx="14" fill="#f3f5f7" stroke="#b9c2cc"/>
  <text x="1150" y="135" font-size="14" font-weight="bold" fill="#4a5560" text-anchor="middle">OUTSIDE</text>
  <rect x="1065" y="150" width="170" height="86" rx="10" fill="#eef4fb" stroke="#1f6fd1" stroke-width="2"/>
  <text x="1150" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b2430">Clé model hub</text>
  <text x="1150" y="197" font-size="12" text-anchor="middle" fill="#5b6672">Charité intranet</text>
  <text x="1150" y="213" font-size="12" text-anchor="middle" fill="#5b6672">clea, frontier, fast, vision</text>
  <rect x="1065" y="270" width="170" height="66" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="1150" y="298" font-size="14" text-anchor="middle" fill="#1b2430">Telegram API</text>
  <text x="1150" y="318" font-size="12" text-anchor="middle" fill="#5b6672">via Charité proxy</text>
  <rect x="1065" y="460" width="170" height="96" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="1150" y="488" font-size="14" text-anchor="middle" fill="#1b2430">Literature APIs</text>
  <text x="1150" y="508" font-size="12" text-anchor="middle" fill="#5b6672">arXiv, PubMed, OpenAlex;</text>
  <text x="1150" y="524" font-size="12" text-anchor="middle" fill="#5b6672">Claude Code web search</text>

  <!-- arrows -->
  <path d="M200,185 H232 V84 H1270 V295 H1237" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M380,148 V94 H1260 V313 H1237" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="380" y1="216" x2="380" y2="238" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="480" y1="273" x2="518" y2="273" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="373" x2="518" y2="373" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M200,280 H240 V395 H278" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="750" y1="193" x2="788" y2="193" stroke="#6b3fb8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="750" y1="304" x2="788" y2="304" stroke="#6b3fb8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="895" y1="236" x2="895" y2="254" stroke="#6b3fb8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1000" y1="193" x2="1063" y2="193" stroke="#1f6fd1" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="1031" y="184" font-size="11" text-anchor="middle" fill="#1f6fd1">data-free</text>
  <path d="M790,226 H770 V436 L712,458" fill="none" stroke="#1d8a5a" stroke-width="2.4" marker-end="url(#ag)"/>
  <text x="836" y="392" font-size="11" fill="#1d8a5a">ids, cohorts, data</text>
  <text x="836" y="406" font-size="11" fill="#1d8a5a">paths -> local GPU</text>
  <path d="M750,405 H760 V420 H860 V458" fill="none" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1000" y1="508" x2="1063" y2="508" stroke="#4a5560" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="508" x2="518" y2="508" stroke="#1d8a5a" stroke-width="1.6" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <path d="M280,410 H262 V630 H278" fill="none" stroke="#4a5560" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="266" y="582" font-size="11" fill="#5b6672" transform="rotate(-90 266 582)">training</text>

  <!-- legend -->
  <rect x="270" y="700" width="730" height="54" rx="10" fill="#fff" stroke="#d5dbe1"/>
  <rect x="290" y="718" width="18" height="18" rx="4" fill="#eef4fb" stroke="#1f6fd1"/><text x="316" y="732" font-size="12" fill="#1b2430">Clé path (data-free work)</text>
  <rect x="500" y="718" width="18" height="18" rx="4" fill="#eaf6f0" stroke="#1d8a5a"/><text x="526" y="732" font-size="12" fill="#1b2430">stays local (patient data)</text>
  <rect x="710" y="718" width="18" height="18" rx="4" fill="#f3eefb" stroke="#6b3fb8"/><text x="736" y="732" font-size="12" fill="#1b2430">System One decides</text>
  <rect x="870" y="718" width="18" height="18" rx="4" fill="#fff8e8" stroke="#c98a00" stroke-dasharray="4 2"/><text x="896" y="732" font-size="12" fill="#1b2430">sandbox</text>
</svg>
